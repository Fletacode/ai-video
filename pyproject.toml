[project]
name = "slide-narrator"
version = "0.1.0"
description = "슬라이드 + 기존 대본 → (Claude Code가 v3 대본 작성) → eleven_v3 TTS → 슬라이드 자동 전환 영상"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10.0",
    "pydub>=0.25.1",
    "gtts>=2.5.4",
    "elevenlabs>=2.54.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
